[package]
name = "aif"
version = "0.2.0"
edition = "2021"
description = "Console and graph engine for the ai-factory workspace"
license = "MIT"

[[bin]]
name = "aif"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
