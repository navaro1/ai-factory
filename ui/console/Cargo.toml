[package]
name = "aif"
version = "0.3.0"
edition = "2021"
description = "Console and graph engine for the ai-factory workspace"
license = "MIT"

[[bin]]
name = "aif"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
kdl = "6.5.0"
ratatui = "0.29"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
