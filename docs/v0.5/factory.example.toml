# Example factory.toml for AI Factory v0.5.
# Copy this file to ~/.config/aif/factory.toml and adjust the paths.
# Every key shown here is optional except each repository's path.

[stage.refine]
model = "claude-opus-5[1m]"
runner = "claude"
limit = 3
yolo = true

[stage.implement]
model = "zai-coding-plan/glm-5.3-flash"
runner = "opencode"
limit = 3

[stage.review]
model = "openai/gpt-5.6-sol"
runner = "opencode"
variant = "xhigh"
limit = 7

[stage.release]
model = "claude-opus-5[1m]"
runner = "claude"
limit = 1

[repo.borsuk]
path = "/home/navaro/Workplace/borsuk"
lanes = { implement = 1 }
release = { policy = "manual" }

[repo.qubitsok]
path = "/home/navaro/Workplace/qubitsok"
release = { policy = "threshold", count = 3 }
