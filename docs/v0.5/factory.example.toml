# Example factory.toml for AI Factory.
schema_version = 1

[stage.refine]
harness = "claude"
model = "claude-opus-5[1m]"
limit = 3

[stage.implement]
harness = "opencode"
model = "zai-coding-plan/glm-5.3-flash"
limit = 3

[stage.review]
harness = "codex"
program = "codex"
model = "gpt-5.6-sol"
profile = "reviewer"
effort = "xhigh"
approval_policy = "never"
sandbox = "workspace-write"
extra_args = []
limit = 7

[stage.release]
harness = "claude"
model = "claude-opus-5[1m]"
limit = 1

[ticket.create]
harness = "claude"
model = "claude-opus-5[1m]"

[ticket.chat]
harness = "claude"
model = "claude-opus-5[1m]"
permission_mode = "manual"
permission_handler = "inbox"
tools = ["Read", "Glob", "Grep"]
extra_args = []

[repo.borsuk]
path = "/home/navaro/Workplace/borsuk"
