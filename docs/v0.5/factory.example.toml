# Example factory.toml for AI Factory.
# Copy this file to ~/.config/aif/factory.toml and adjust the paths.
schema_version = 1

[stage.refine]
harness = "claude"
model = "claude-opus-5[1m]"
limit = 3

[stage.implement]
harness = "opencode"
model = "zai-coding-plan/glm-5.3-flash"
limit = 3

[stage.review]
harness = "opencode"
model = "openai/gpt-5.6-sol"
effort = "xhigh"
extra_args = []
limit = 7

[stage.release]
harness = "claude"
model = "claude-opus-5[1m]"
limit = 1

[ticket.create]
harness = "claude"
model = "claude-opus-5[1m]"

[ticket.chat]
harness = "claude"
model = "claude-opus-5[1m]"
permission_mode = "manual"
permission_handler = "inbox"
tools = ["Read", "Glob", "Grep"]
extra_args = []

[repo.borsuk]
path = "/home/navaro/Workplace/borsuk"
lanes = { implement = 1 }
release = { policy = "manual" }

[repo.borsuk.stage.review]
effort = "max"
