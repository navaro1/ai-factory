# Example factory.toml for AI Factory.
# Copy this file to ~/.config/aif/factory.toml and adjust the paths.
schema_version = 1

[stage.refine]
harness = "claude"
model = "claude-opus-5[1m]"
limit = 3

# auto_approve = true passes --auto to opencode. Without it, an unattended
# opencode run auto-rejects every permission request and its tools fail.
[stage.implement]
harness = "opencode"
model = "zai-coding-plan/glm-5.3-flash"
auto_approve = true
limit = 3

[stage.review]
harness = "opencode"
model = "openai/gpt-5.6-sol"
effort = "xhigh"
extra_args = []
auto_approve = true
limit = 7

[stage.release]
harness = "claude"
model = "claude-opus-5[1m]"
limit = 1

[ticket.create]
harness = "claude"
model = "claude-opus-5[1m]"

[ticket.chat]
harness = "claude"
model = "claude-opus-5[1m]"
permission_mode = "manual"
permission_handler = "inbox"
tools = ["Read", "Glob", "Grep"]
extra_args = []

# AI Factory selects implementation and review settings from complexity tags.
# All eight balanced routes exist without tables in this file.
# A missing valid tag selects the medium route.
# Multiple valid tags select the highest route.
#
# [tag_routes.implement.high]
# model = "gpt-5.6-sol"
# effort = "max"
#
# [tag_routes.review.very-high]
# harness = "claude"
# model = "claude-opus-5[1m]"
# permission_mode = "bypassPermissions"

# The factory owns six labels and two complexity prefixes. The names below
# are the defaults. Set a key here to rename that label everywhere: the
# gates, the release train, the router, and the agent prompts.
#
# [labels]
# to_refine = "to-refine"
# refined = "refined"
# epic = "epic"
# chunk = "chunk"
# needs_human = "needs-human"
# release_stacked = "release-stacked"
# complexity_prefix = "complexity:"
# review_complexity_prefix = "review-complexity:"

# Usage probes. When enabled, the daemon reads the quota and spend of each
# billed identity and shows it in the USAGE band of the pipeline view.
# minutes is the cadence per identity, from 1 to 1440.
#[usage]
#enabled = true
#minutes = 10

[repo.borsuk]
path = "/home/navaro/Workplace/borsuk"
lanes = { implement = 1 }
release = { policy = "manual" }

# A repository can override one global tag route.
# [repo.borsuk.tag_routes.implement.high]
# effort = "max"

# A repository can rename any label. This suits a repository that already
# prefixes every type label.
# [repo.borsuk.labels]
# epic = "type:epic"
# chunk = "type:chunk"
